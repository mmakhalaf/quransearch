
<fieldset class="opts">
   <legend class="opts-title">
      <mat-icon class="opts-title-item">filter_list</mat-icon>
      <span class="opts-title-item">التصفيات الحالية</span>
   </legend>

   <div class="opts-group">
      <mat-chip-set>
         <button mat-icon-button (click)="onClearAllClicked()">
            <mat-icon>clear_all</mat-icon>
         </button>
         <mat-chip-row *ngFor="let f of qService.searchCriteriaPres.filters" (removed)="onRemoveFilterClicked(f)" [disableRipple]="true">
            <span [innerHTML]="f.to_string()" (click)="onSelectFilterClicked(f)"></span>
            <button matChipRemove>
               <mat-icon>cancel</mat-icon>
            </button>
         </mat-chip-row>
      </mat-chip-set>
   </div>
</fieldset>
