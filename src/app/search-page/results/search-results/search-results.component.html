
<div *ngIf="qService.matches.length() > 0" class="data-msg">
   عدد الآيات: {{num_results()}}،
   وردت: {{num_occurances()}} مرة
</div>

<fieldset class="opts root-card" *ngIf="roots.length > 0">
   <legend class="opts-title">
      <span class="opts-title-item">الجذور</span>
   </legend>
   <span *ngFor="let r of roots" class="root-word" (click)="onRootClicked(r)">
      {{r.text}}
   </span>
</fieldset>

<cdk-virtual-scroll-viewport autosize class="results-viewport">
   <qsearch-result
      *cdkVirtualFor="let r of qService.matches.results; trackBy: trackByAyah"
      [result]="r"
      >
   </qsearch-result>
</cdk-virtual-scroll-viewport>
